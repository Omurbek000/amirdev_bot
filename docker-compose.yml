services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ANALYTICS_FILE: /app/data/analytics.log
    volumes:
      - bot_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  bot_data:
